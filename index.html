<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambridge Dossier · 117 C1 Phrasal Verbs · Matching Columns</title>
<style>
:root{
  --ink:#17233b;--muted:#667085;--paper:#f5f1e8;--card:#fffdf8;--line:#d8d0c1;
  --navy:#102a43;--navy2:#173f5f;--burg:#8c2f39;--gold:#b58a4a;--green:#177245;--red:#a23b3b;
  --shadow:0 18px 50px rgba(17,34,56,.12);--radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}
button{font:inherit}
.shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.topbar{position:sticky;top:0;z-index:30;background:rgba(245,241,232,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(16,42,67,.12)}
.topbar-inner{max-width:1180px;margin:auto;padding:14px 22px 12px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.eyebrow{font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--burg)}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,3vw,31px);line-height:1.05;margin:5px 0 0;color:var(--navy)}
.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;color:var(--navy);white-space:nowrap;cursor:pointer}
.progress-wrap{max-width:1180px;margin:auto;padding:0 22px 10px}
.progress-track{height:5px;background:#e2dccf;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--navy2),var(--burg));transition:width .35s ease}

.stage-viewport{width:100%;overflow:hidden}
.module{padding:28px 22px 34px;display:flex;justify-content:center;align-items:flex-start}
.dossier{width:min(100%,1080px);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dossier-head{display:grid;grid-template-columns:1fr auto;gap:18px;padding:23px 26px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf8 0%,#fbf6ec 100%)}
.case-id{font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--burg)}
.focus{font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,4vw,38px);margin:6px 0 7px;color:var(--navy);font-weight:700}
.subhead{font-size:14px;line-height:1.55;color:#475467;max-width:760px}
.module-stats{align-self:start;border:1px solid var(--line);background:white;border-radius:14px;padding:11px 13px;min-width:120px;text-align:center}
.module-stats strong{font:800 20px/1 Georgia,serif;color:var(--navy)}
.module-stats span{display:block;margin-top:4px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.task{padding:22px 26px 27px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.instructions{font-size:13px;color:#596579;line-height:1.45}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:850;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.warn{color:var(--burg)}

.match-grid{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
.column{min-width:0}
.col-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 9px}
.label{font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#667085}
.micro{font-size:11px;color:#8a8173}
.card-list{display:grid;gap:9px}
.match-card{width:100%;text-align:left;border:1px solid #d1c8ba;background:#fff;border-radius:13px;padding:13px 14px;color:var(--ink);cursor:pointer;transition:.15s;box-shadow:0 2px 0 rgba(16,42,67,.04)}
.match-card:hover{border-color:#9f907a;transform:translateY(-1px)}
.match-card.left{font-family:Georgia,"Times New Roman",serif;font-size:18px;font-weight:700;color:var(--navy);min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.match-card.right{min-height:78px}
.match-card .def{font-size:14px;line-height:1.45;font-weight:700;color:#334155}
.vi-support{margin:0 0 16px;border:1px solid #ddd2c0;background:#fffaf0;border-radius:14px;padding:13px 15px}
.vi-support-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.vi-support-title{font:800 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.11em;text-transform:uppercase;color:#7a4b43}
.vi-support-note{font-size:11px;color:#9a766e}
.vi-support-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.vi-support-item{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.5;color:#6f433d}
.vi-support-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#efe0cb;color:#70443d;font-size:10px;font-weight:900}
body.vi-hidden .vi-support{display:none}
.match-card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(181,138,74,.15);background:#fffaf0}
.match-card.matched{border-color:#74a989;background:#edf7f1;cursor:default;transform:none}
.match-card.matched .badge{display:inline-flex}
.match-card.wrong{border-color:#c16d6d;background:#fbefef}
.badge{display:none;flex:0 0 auto;width:25px;height:25px;border-radius:50%;align-items:center;justify-content:center;background:#177245;color:#fff;font-size:13px;font-weight:900}
.right .badge{float:right;margin-left:10px}

.feedback{min-height:43px;margin-top:14px;border-radius:12px;display:flex;align-items:center;font-size:13px;font-weight:750}
.feedback.good{padding:11px 13px;background:#edf7f1;color:#165d3a}
.feedback.bad{padding:11px 13px;background:#fbefef;color:#8c2f39}
.feedback.info{padding:11px 13px;background:#f5f1e8;color:#5e564c}

.review{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.review.locked{display:none}
.review-toggle{width:100%;border:0;background:#f9f5ec;color:var(--navy);padding:12px 14px;text-align:left;font-weight:850;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.review-body{display:none;padding:12px 14px 14px;border-top:1px solid var(--line)}
.review.open .review-body{display:block}
.review-item{padding:10px 0;border-bottom:1px dashed #ded5c6}
.review-item:last-child{border-bottom:0}
.review-target{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:6px}
.ex{font-size:13px;line-height:1.5;color:#3f4b5d;margin:4px 0}
.ex.vi{color:#7a4b43}
body.vi-hidden .ex.vi{display:none}

.bottomnav{position:sticky;bottom:0;z-index:30;background:rgba(245,241,232,.95);backdrop-filter:blur(14px);border-top:1px solid rgba(16,42,67,.12)}
.bottom-inner{max-width:1080px;margin:auto;padding:12px 22px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.navbtn{border:1px solid #cbbfae;background:#fff;border-radius:12px;padding:11px 14px;font-weight:900;color:var(--navy);cursor:pointer;min-width:100px}
.navbtn.next{justify-self:end;background:var(--navy);border-color:var(--navy);color:white}
.navbtn:disabled{opacity:.4;cursor:not-allowed}
.counter{font:800 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6d665d;text-align:center}

.drawer{position:fixed;inset:0 0 0 auto;width:min(390px,92vw);background:#fffdf8;z-index:80;box-shadow:-22px 0 50px rgba(17,34,56,.18);transform:translateX(105%);transition:.3s;padding:22px;overflow:auto}
.drawer.open{transform:translateX(0)}
.drawer h2{font:700 25px/1.15 Georgia,serif;color:var(--navy);margin:5px 0 16px}
.indexgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.idx{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 5px;font-weight:800;color:var(--navy);cursor:pointer}
.idx.current{background:var(--navy);color:#fff}
.idx.done{border-color:#68a17f;background:#edf7f1}
.overlay{position:fixed;inset:0;background:rgba(16,42,67,.18);backdrop-filter:blur(2px);z-index:70;display:none}
.overlay.open{display:block}

@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:nudge .22s linear}

@media (max-width:720px){
  .topbar-inner{grid-template-columns:1fr}
  .meta{justify-content:flex-start}
  .module{padding:18px 10px 26px}
  .dossier-head{grid-template-columns:1fr}
  .module-stats{justify-self:start}
  .dossier-head,.task{padding-left:16px;padding-right:16px}
  .match-grid{grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:8px}
  .match-card{padding:10px 9px;border-radius:11px}
  .match-card.left{font-size:14px;min-height:70px}
  .match-card.right{min-height:70px}
  .match-card .def{font-size:12px}
  .vi-line{font-size:10px}
  .bottom-inner{padding:10px 10px}
  .navbtn{min-width:82px;padding:10px}
}
@media (prefers-reduced-motion:reduce){.drawer,.progress-fill{transition:none}}
</style>
</head>

["The new hairstyle has really caught on with teenagers in my town."],"vi_examples":["Kiểu tóc mới đã thực sự trở nên thịnh hành trong giới thanh thiếu niên ở thị trấn của tôi."]},{"id":10,"target":"catch on · understand","meaning":"to understand/realise after a long time","examples":["I kept dropping hints about what I wanted for my birthday but my wife didn’t catch on."],"vi_examples":["Tôi cứ liên tục gợi ý về món quà sinh nhật mình muốn, nhưng mãi mà vợ tôi vẫn không hiểu ra."]},{"id":11,"target":"cheer up","meaning":"make happier","examples":["I bought him a pint to try to cheer him up"],"vi_examples":["Tôi mua cho anh ấy một cốc bia để cố làm anh ấy vui lên."]},{"id":12,"target":"come across","meaning":"find by chance","examples":["I came across my old school books while I was clearing out the attic."],"vi_examples":["Tôi tình cờ tìm thấy những cuốn sách cũ thời đi học khi đang dọn gác mái."]},{"id":13,"target":"come into (money)","meaning":"inherit","examples":["He came into quite a lot of money when his grandparents passed away."],"vi_examples":["Anh ấy được thừa kế một khoản tiền khá lớn khi ông bà qua đời."]},{"id":14,"target":"come round","meaning":"come to your house","examples":["Come round after school and we’ll work on the science project together."],"vi_examples":["Ghé qua nhà tôi sau giờ học nhé, rồi chúng ta sẽ cùng làm dự án khoa học."]},{"id":15,"target":"come up with","meaning":"think of and suggest an idea","examples":["I’ve come up with a great idea for our Halloween costumes."],"vi_examples":["Tôi đã nghĩ ra một ý tưởng rất hay cho trang phục Halloween của chúng ta."]},{"id":16,"target":"come up","meaning":"be mentioned, arise or appear (in class / an exam / a meeting)","examples":["The topic of a pay rise came up in my meeting with the boss."],"vi_examples":["Chủ đề tăng lương đã được nhắc đến trong cuộc họp của tôi với sếp."]},{"id":17,"target":"count on","meaning":"to rely on","examples":["Don’t be late! Everyone is counting on you."],"vi_examples":["Đừng đến muộn! Mọi người đều đang trông cậy vào bạn."]},{"id":18,"target":"cut down on","meaning":"reduce the amount you consume","examples":["My New Year’s resolution is to cut down on fast food."],"vi_examples":["Mục tiêu năm mới của tôi là cắt giảm đồ ăn nhanh."]},{"id":19,"target":"cut off","meaning":"separate / isolate / interrupt","examples":["Sorry, the call got cut off when we went through a tunnel."],"vi_examples":["Xin lỗi, cuộc gọi bị ngắt khi chúng tôi đi qua một đường hầm."]},{"id":20,"target":"cut out","meaning":"stop doing / eating something","examples":["My doctor has told me I need to cut out all processed meats from my diet."],"vi_examples":["Bác sĩ bảo tôi cần loại bỏ hoàn toàn các loại thịt chế biến sẵn khỏi chế độ ăn."]},{"id":21,"target":"do up","meaning":"fasten, button up clothes; repair, redecorate or modernize a building or room","examples":["The child was struggling to do up his shoelaces.","We’re doing up our house this summer."],"vi_examples":["Đứa trẻ đang loay hoay buộc dây giày.","Mùa hè này chúng tôi đang sửa sang lại ngôi nhà."]},{"id":22,"target":"dress up","meaning":"put on different clothes in order to disguise yourself","examples":["We all dressed up as monsters for Halloween."],"vi_examples":["Tất cả chúng tôi đều hóa trang thành quái vật vào dịp Halloween."]},{"id":23,"target":"drop by","meaning":"to visit informally or unexpectedly","examples":["My Dad dropped by on his way home to work to say hello."],"vi_examples":["Bố tôi ghé qua để chào một tiếng trên đường đi làm."]},{"id":24,"target":"drop off","meaning":"to take something (or someone) to a place and leave it there","examples":["He also came to drop off my Christmas presents.","The taxi dropped us off outside the airport."],"vi_examples":["Anh ấy cũng ghé để mang quà Giáng sinh của tôi tới.","Chiếc taxi cho chúng tôi xuống ngay bên ngoài sân bay."]},{"id":25,"target":"drop out","meaning":"stop taking part in (a competition, a university, etc.)","examples":[" "examples":["He always uses up all the toilet roll and doesn’t replace it."],"vi_examples":["Anh ấy luôn dùng hết giấy vệ sinh mà không thay cuộn mới."]},{"id":116,"target":"wear out","meaning":"to use something until it becomes unusable","examples":["I’ve completely worn out my old football boots, I need to get some new ones."],"vi_examples":["Tôi đã dùng đôi giày bóng đá cũ đến mức mòn hẳn; tôi cần mua đôi mới."]},{"id":117,"target":"work out","meaning":"think about and find a solution; do exercise","examples":["I work out 3 times a week at the gym.","The students struggled to work out the complicated equations.","The police couldn’t work out how the burglars got into the house."],"vi_examples":["Tôi tập thể dục ở phòng gym ba lần một tuần.","Các học sinh chật vật tìm cách giải những phương trình phức tạp.","Cảnh sát không thể tìm ra cách những tên trộm đã đột nhập vào ngôi nhà."]}];
const PER_MODULE=6;
const MODULES=Math.ceil(DATA.length/PER_MODULE);
const STORAGE_KEY='c1_phrasal_matching_columns_v1';

let state={module:0,matched:{},viVisible:true,shuffleVersion:{}};
try{state={...state,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch(e){}
if(!Number.isInteger(state.module)||state.module<0||state.module>=MODULES) state.module=0;
if(typeof state.viVisible!=='boolean') state.viVisible=true;
if(!state.matched||typeof state.matched!=='object') state.matched={};
if(!state.shuffleVersion||typeof state.shuffleVersion!=='object') state.shuffleVersion={};

const stage=document.getElementById('stage');
const counter=document.getElementById('counter');
const scorePill=document.getElementById('scorePill');
const progressFill=document.getElementById('progressFill');
const backBtn=document.getElementById('backBtn');
const nextBtn=document.getElementById('nextBtn');
const viBtn=document.getElementById('viBtn');
const indexBtn=document.getElementById('indexBtn');
const resetAllBtn=document.getElementById('resetAllBtn');
const drawer=document.getElementById('drawer');
const overlay=document.getElementById('overlay');
const indexGrid=document.getElementById('indexGrid');

let selectedLeft=null, selectedRight=null;

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function chunk(mi){return DATA.slice(mi*PER_MODULE,Math.min(DATA.length,(mi+1)*PER_MODULE))}
function totalMatched(){return Object.values(state.matched).filter(Boolean).length}
function moduleComplete(mi){return chunk(mi).every(d=>state.matched[d.id])}
function moduleMatched(mi){return chunk(mi).filter(d=>state.matched[d.id]).length}

function seededShuffle(items,seed){
  let x=seed>>>0;
  const a=items.slice();
  function rnd(){x=(x*1664525+1013904223)>>>0;return x/4294967296}
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(a.length>1 && a.every((v,i)=>v===items[i])) [a[0],a[1]]=[a[1],a[0]];
  return a;
}

function rightOrder(items,mi){
  const v=Number(state.shuffleVersion[mi]||0);
  return seededShuffle(items, 1907 + mi*97 + v*997);
}

function moduleHTML(mi){
  const items=chunk(mi);
  const right=rightOrder(items,mi);
  const first=items[0].id,last=items[items.length-1].id;
  return `<section class="module" data-module="${mi}">
    <article class="dossier">
      <header class="dossier-head">
        <div>
          <div class="case-id">Matching Module ${String(mi+1).padStart(2,'0')} · Items ${first}–${last}</div>
          <div class="focus">Match the phrasal verb</div>
          <div class="subhead">Choose one card from each column. Correct pairs lock automatically.</div>
        </div>
        <div class="module-stats"><strong id="moduleScore">${moduleMatched(mi)} / ${items.length}</strong><span>matched</span></div>
      </header>

      <div class="task">
        <div class="toolbar">
          <div class="instructions">Left: phrasal verb · Right: source meaning. Match each item with its correct definition.</div>
          <div class="toolbar-actions">
            <button class="btn" id="shuffleBtn" type="button">Shuffle meanings</button>
            <button class="btn warn" id="resetModuleBtn" type="button">Reset module</button>
          </div>
        </div>

        <div class="match-grid">
          <section class="column">
            <div class="col-head"><div class="label">Phrasal verbs</div><div class="micro">${items.length} items</div></div>
            <div class="card-list" id="leftList">
            ${items.map((d,i)=>`
              <button class="match-card left ${state.matched[d.id]?'matched':''}" type="button" data-side="left" data-id="${d.id}">
                <span>${esc(d.target)}</span><span class="badge">✓</span>
              </button>`).join('')}
            </div>
          </section>

          <section class="column">
            <div class="col-head"><div class="label">Meanings</div><div class="micro">shuffled</div></div>
            <div class="card-list" id="rightList">
            ${right.map(d=>`
              <button class="match-card right ${state.matched[d.id]?'matched':''}" type="button" data-side="right" data-id="${d.id}">
                <span class="badge">✓</span>
                <span class="def">${esc(d.meaning)}</span>
              </button>`).join('')}
            </div>
          </section>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="review ${moduleComplete(mi)?'':'locked'}" id="review">
          <button class="review-toggle" id="reviewToggle" type="button">
            <span>Review source sentences</span><span id="reviewMark">＋</span>
          </button>
          <div class="review-body">
            ${items.map(d=>`
              <div class="review-item">
                <div class="review-target">${esc(d.target)} — ${esc(d.meaning)}</div>
                ${d.examples.map((ex,j)=>`<div class="ex">${esc(ex)}</div><div class="ex vi">${esc((d.vi_examples||[])[j]||'')}</div>`).join('')}
              </div>`).join('')}
          </div>
        </div>
      </div>
    </article>
  </section>`;
}

function render(){
  selectedLeft=null;selectedRight=null;
  stage.innerHTML=moduleHTML(state.module);
  document.body.classList.toggle('vi-hidden',!state.viVisible);
  wire();
  updateChrome();
  requestAnimationFrame(anchorModule);
}

function anchorModule(){
  const vp=document.getElementById('viewport');
  const topbar=document.querySelector('.topbar');
  const y=vp.getBoundingClientRect().top+window.scrollY-(topbar?.offsetHeight||0)-8;
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}

function wire(){
  document.querySelectorAll('[data-side="left"]').forEach(b=>b.addEventListener('click',()=>selectCard('left',b)));
  document.querySelectorAll('[data-side="right"]').forEach(b=>b.addEventListener('click',()=>selectCard('right',b)));
  document.getElementById('shuffleBtn').onclick=()=>{
    state.shuffleVersion[state.module]=(Number(state.shuffleVersion[state.module]||0)+1);
    save();render();
  };
  document.getElementById('resetModuleBtn').onclick=()=>{
    chunk(state.module).forEach(d=>delete state.matched[d.id]);
    save();render();
  };
  document.getElementById('reviewToggle').onclick=()=>{
    const r=document.getElementById('review');r.classList.toggle('open');
    document.getElementById('reviewMark').textContent=r.classList.contains('open')?'−':'＋';
  };
}

function selectCard(side,btn){
  const id=Number(btn.dataset.id);
  if(state.matched[id]) return;
  document.querySelectorAll(`.match-card[data-side="${side}"]`).forEach(x=>x.classList.remove('selected'));
  btn.classList.add('selected');
  if(side==='left') selectedLeft={id,btn};
  else selectedRight={id,btn};
  if(selectedLeft && selectedRight) evaluatePair();
}

function evaluatePair(){
  const fb=document.getElementById('feedback');
  if(selectedLeft.id===selectedRight.id){
    const id=selectedLeft.id;
    state.matched[id]=true;
    selectedLeft.btn.classList.remove('selected');selectedRight.btn.classList.remove('selected');
    selectedLeft.btn.classList.add('matched');selectedRight.btn.classList.add('matched');
    selectedLeft.btn.querySelector('.badge').style.display='inline-flex';
    selectedRight.btn.querySelector('.badge').style.display='inline-flex';
    selectedLeft=null;selectedRight=null;
    save();updateChrome();
    document.getElementById('moduleScore').textContent=`${moduleMatched(state.module)} / ${chunk(state.module).length}`;
    if(moduleComplete(state.module)){
      fb.className='feedback good';
      fb.textContent='Module complete — all pairs matched correctly. Review source sentences is now available.';
      const review=document.getElementById('review');
      if(review) review.classList.remove('locked');
    }else{
      fb.className='feedback good';
      fb.textContent='Correct pair.';
    }
  }else{
    const l=selectedLeft.btn,r=selectedRight.btn;
    l.classList.add('wrong','shake');r.classList.add('wrong','shake');
    fb.className='feedback bad';fb.textContent='Not a match — try again.';
    setTimeout(()=>{
      [l,r].forEach(x=>x.classList.remove('selected','wrong','shake'));
      selectedLeft=null;selectedRight=null;
    },420);
  }
}

function updateChrome(){
  const matched=totalMatched();
  scorePill.textContent=`Matched ${matched} / ${DATA.length}`;
  progressFill.style.width=`${(matched/DATA.length)*100}%`;
  counter.textContent=`${state.module+1} / ${MODULES}`;
  backBtn.disabled=state.module===0;
  nextBtn.disabled=state.module===MODULES-1;
  viBtn.textContent=state.viVisible?'Ẩn tiếng Việt':'Hiện tiếng Việt';
  buildIndex();
}

function buildIndex(){
  indexGrid.innerHTML=Array.from({length:MODULES},(_,mi)=>`<button class="idx ${mi===state.module?'current':''} ${moduleComplete(mi)?'done':''}" data-mi="${mi}" type="button">${mi+1}</button>`).join('');
  indexGrid.querySelectorAll('.idx').forEach(b=>b.onclick=()=>{state.module=Number(b.dataset.mi);save();closeDrawer();render()});
}

function go(delta){
  const n=state.module+delta;
  if(n<0||n>=MODULES)return;
  state.module=n;save();render();
}
backBtn.onclick=()=>go(-1);
nextBtn.onclick=()=>go(1);

viBtn.onclick=()=>{
  state.viVisible=!state.viVisible;
  document.body.classList.toggle('vi-hidden',!state.viVisible);
  viBtn.textContent=state.viVisible?'Ẩn tiếng Việt':'Hiện tiếng Việt';
  save();
};

function openDrawer(){drawer.classList.add('open');overlay.classList.add('open')}
function closeDrawer(){drawer.classList.remove('open');overlay.classList.remove('open')}
indexBtn.onclick=openDrawer;
overlay.onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

resetAllBtn.onclick=()=>{
  if(confirm('Reset all matching progress?')){
    state={module:0,matched:{},viVisible:state.viVisible,shuffleVersion:{}};
    save();render();
  }
};

render();
</script>
</body>
</html>
